name: aitu-lockers-prod

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  environment:
    DATABASE_URL: postgresql+psycopg://locker:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/locker_management
    API_PREFIX: /api/v1
    FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-https://locker.b3mug1.dev,http://locker.b3mug1.dev,http://63.182.255.51}
    SESSION_HOURS: ${SESSION_HOURS:-8}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: locker_management
      POSTGRES_USER: locker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U locker -d locker_management']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  backend:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/api/v1/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-locker.b3mug1.dev}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
