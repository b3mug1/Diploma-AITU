name: Verify backend and deployment
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: locker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d locker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:synthetic-ci-only@localhost:5432/locker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.lock -r requirements-dev.txt
      - run: ruff check app tests alembic
      - run: python -m pytest -q

  compose:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: |
          curl --fail http://localhost:8080/api/v1/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/students)" = 401
          docker compose exec -T frontend nginx -t
          docker compose exec -T backend alembic check
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
