name: aitu-lockers

x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://locker:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/locker_management
    API_PREFIX: /api/v1
    FRONTEND_ORIGINS: http://localhost:${WEB_PORT:-8080}
    SESSION_HOURS: ${SESSION_HOURS:-8}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: locker_management
      POSTGRES_USER: locker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U locker -d locker_management']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  backend:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/api/v1/health/ready]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
